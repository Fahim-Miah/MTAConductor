<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .error { color: red; background: #fee; padding: 10px; border: 1px solid red; margin: 10px 0; }
    .success { color: green; background: #efe; padding: 10px; border: 1px solid green; margin: 10px 0; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>MTA Conductor Exam Prep - Debug Test</h1>
  
  <div id="status"></div>
  
  <h2>Test Results:</h2>
  <div id="results"></div>
  
  <h2>Console Output:</h2>
  <pre id="console"></pre>
  
  <script>
    // Capture console output
    const consoleOutput = [];
    const originalConsole = {
      log: console.log,
      error: console.error,
      warn: console.warn
    };
    
    console.log = function(...args) {
      consoleOutput.push(['LOG', ...args].join(' '));
      originalConsole.log.apply(console, args);
      updateConsole();
    };
    
    console.error = function(...args) {
      consoleOutput.push(['ERROR', ...args].join(' '));
      originalConsole.error.apply(console, args);
      updateConsole();
    };
    
    console.warn = function(...args) {
      consoleOutput.push(['WARN', ...args].join(' '));
      originalConsole.warn.apply(console, args);
      updateConsole();
    };
    
    function updateConsole() {
      document.getElementById('console').textContent = consoleOutput.join('\n');
    }
    
    // Run tests
    const results = [];
    
    function addResult(test, passed, details = '') {
      results.push({ test, passed, details });
      updateResults();
    }
    
    function updateResults() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = results.map(r => 
        `<div class="${r.passed ? 'success' : 'error'}">
          <strong>${r.passed ? '✓' : '✗'} ${r.test}</strong>
          ${r.details ? `<br><small>${r.details}</small>` : ''}
        </div>`
      ).join('');
    }
    
    // Test 1: Check if app.js loads
    try {
      const script = document.createElement('script');
      script.src = './app.js';
      script.onload = () => {
        addResult('app.js loads successfully', true);
        
        // Test 2: Check if QUESTIONS array exists
        setTimeout(() => {
          if (typeof QUESTIONS !== 'undefined') {
            addResult('QUESTIONS array exists', true, `Found ${QUESTIONS.length} questions`);
            
            // Test 3: Check if CATEGORIES array exists
            if (typeof CATEGORIES !== 'undefined') {
              addResult('CATEGORIES array exists', true, `Found ${CATEGORIES.length} categories`);
              
              // Test 4: Check if init function exists
              if (typeof init === 'function') {
                addResult('init function exists', true);
                
                // Test 5: Check if renderHome function exists
                if (typeof renderHome === 'function') {
                  addResult('renderHome function exists', true);
                  
                  // Test 6: Try to call renderHome
                  try {
                    renderHome();
                    addResult('renderHome executes without error', true);
                    
                    // Test 7: Check if category-grid has content
                    const grid = document.getElementById('category-grid');
                    if (grid && grid.innerHTML.length > 0) {
                      addResult('category-grid has content', true, `Content length: ${grid.innerHTML.length}`);
                    } else {
                      addResult('category-grid has content', false, 'Grid is empty or not found');
                    }
                    
                  } catch (e) {
                    addResult('renderHome executes without error', false, e.message);
                  }
                  
                } else {
                  addResult('renderHome function exists', false);
                }
                
              } else {
                addResult('init function exists', false);
              }
              
            } else {
              addResult('CATEGORIES array exists', false);
            }
            
          } else {
            addResult('QUESTIONS array exists', false, 'QUESTIONS is undefined');
          }
        }, 100);
        
      };
      script.onerror = () => {
        addResult('app.js loads successfully', false, 'Script failed to load');
      };
      document.head.appendChild(script);
    } catch (e) {
      addResult('app.js loads successfully', false, e.message);
    }
    
    // Update status
    document.getElementById('status').innerHTML = '<div class="success">Running tests...</div>';
    
    // Check for errors after 2 seconds
    setTimeout(() => {
      const allPassed = results.every(r => r.passed);
      if (allPassed) {
        document.getElementById('status').innerHTML = '<div class="success"><strong>All tests passed!</strong> The application is working correctly.</div>';
      } else {
        document.getElementById('status').innerHTML = '<div class="error"><strong>Some tests failed!</strong> Check the results below for details.</div>';
      }
    }, 2000);
  </script>
</body>
</html>
